<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session 10 — Security</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    nav a { margin-right: 12px; }
    .error { color: #c00; }
    .comment { border: 1px solid #ddd; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
    .comment small { color: #888; }
    input, textarea { display: block; width: 100%; margin: 4px 0 12px; padding: 6px; box-sizing: border-box; }
    button { padding: 6px 18px; }
    ul.errors { color: #c00; padding-left: 18px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    {% if user.is_authenticated %}
      <span>Logged in as <strong>{{ user.username }}</strong></span>
      <a href="/logout/">Logout</a>
    {% else %}
      <a href="/login/">Login</a>
      <a href="/register/">Register</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
