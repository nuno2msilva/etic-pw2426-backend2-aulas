{% extends "base.html" %}
{% block content %}
<h2>Register</h2>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <label>{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}
      <ul class="errors">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>
    {% endif %}
  {% endfor %}
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="/login/">Login</a></p>
{% endblock %}
